[build-system]
requires = []
build-backend = "_triadicbrain_build_backend"
backend-path = ["."]

[project]
name = "triadicbrain"
version = "0.1.0a0.dev4"
description = "Public development alpha for bounded, local-first Triadic Brain review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "MPL-2.0 AND Unicode-3.0"
license-files = ["LICENSE", "licenses/Unicode-3.0.txt"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.scripts]
triadicbrain = "triadicbrain.cli:main"

[tool.triadicbrain]
authority-effect = "NONE"
public-release-eligible = false
rights-status = "HOLD"
provider-policy = "DENY"
network-policy = "LOOPBACK_SERVE_ONLY"
distribution-status = "PUBLIC_DEVELOPMENT_NO_FORMAL_RELEASE"
repository-visibility = "PUBLIC"
source-publicly-available = true
formal-release-created = false
package-published = false
pages-enabled = false
