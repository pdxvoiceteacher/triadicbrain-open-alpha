name: oa01-linux-python312
on:
  workflow_dispatch:
jobs:
  private-alpha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/oa01_validate.py
