name: Public development alpha CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-development-alpha-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-development-alpha:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned CI tooling
        run: >-
          python -m pip install
          --disable-pip-version-check
          --requirement .github/requirements-private-alpha-ci.txt

      - name: Run public-development gates
        run: >-
          python -B tools/run_private_alpha_ci.py
          --repository-mode public-github-unreleased
          --expected-origin pdxvoiceteacher/triadicbrain-open-alpha
          --evidence-root "${{ runner.temp }}/triadicbrain-public-development-${{ runner.os }}"

      - name: Upload compact gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-development-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/triadicbrain-public-development-${{ runner.os }}
          if-no-files-found: error
          retention-days: 14
