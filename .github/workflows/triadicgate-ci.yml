name: TriadicGate portable Linux root gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-root-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install governed component profile
        run: python -m pip install -e 'components/CoherenceLattice[test]' -e components/Sophia -e 'components/uvlm-publications[test]'
      - name: Root preflight
        run: python integration/tools/preflight.py
      - name: Integration unittest discovery
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/triadicgate-aggregate"
          python -m unittest discover -s integration/tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/triadicgate-aggregate/integration_unittest.log"
      - name: Focused P0 contracts
        run: python -m pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/triadicgate-aggregate/focused_p0.xml" integration/tests/test_normalized_baseline.py integration/tests/test_aggregate_preflight.py
      - name: Aggregate preflight
        run: python integration/tools/aggregate_preflight.py --config integration/config/aggregate_gate.v1.json --out-dir "$RUNNER_TEMP/triadicgate-aggregate"
      - name: Upload compact evidence
        uses: actions/upload-artifact@v4
        with:
          name: triadicgate-linux-root-evidence
          path: ${{ runner.temp }}/triadicgate-aggregate
          if-no-files-found: error
      # Ubuntu CI is not Windows acceptance, wheel closure, release, deployment,
      # professional assurance, or truth certification.
